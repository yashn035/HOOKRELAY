name: k6 Load Test & CI SLO Gates

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  load-test-slo-gate:
    name: k6 Ramping Load Test & SLO Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start Docker Compose Stack
        run: |
          docker compose up -d --build postgres redis api
        env:
          HOOKRELAY_WORKER_ENABLED: "false"
          HOOKRELAY_SEED_ENABLED: "true"

      - name: Wait for HookRelay API to be Healthy
        run: |
          echo "Waiting for HookRelay API to become healthy..."
          for i in {1..60}; do
            if curl -s -f http://localhost:8080/health || curl -s -f http://localhost:8080/actuator/health; then
              echo ""
              echo "HookRelay API is up and healthy!"
              exit 0
            fi
            echo "Waiting for API... ($i/60)"
            sleep 3
          done
          echo "HookRelay API failed to become healthy in time."
          docker compose logs api
          exit 1

      - name: Run k6 Ramping Load Test
        run: |
          k6 run --no-thresholds scripts/load-test.js
        env:
          API_URL: http://localhost:8080
          API_KEY: hr_live_demo_acme_production_key_001

      - name: Verify SLO Gates
        run: |
          python scripts/assert_slo.py summary.json
        env:
          MAX_P99_MS: "2500.0"
          MAX_ERROR_RATE: "0.05"

      - name: Upload k6 Summary Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-slo-summary
          path: summary.json

      - name: Teardown Docker Compose Stack
        if: always()
        run: |
          docker compose down -v

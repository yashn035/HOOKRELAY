name: HookRelay CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-build:
    name: Backend Test & Build (Java 21)
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run Maven Tests & Verify (JaCoCo + Testcontainers)
        run: mvn -B clean verify

      - name: Dump Surefire Reports on Failure
        if: failure()
        run: |
          for f in $(find . -type f -name "*.txt" | grep surefire-reports); do
            echo "================================================================"
            echo "FAILURE REPORT: $f"
            echo "================================================================"
            cat "$f"
          done

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: core/target/site/jacoco/

      - name: Set up Python for Contract Testing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install QA Contract Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r qa-tests/requirements.txt

      - name: Run OpenAPI Contract Tests
        run: |
          pytest qa-tests

      - name: Build Backend Docker Image
        run: docker build -t hookrelay:ci .

  frontend-build:
    name: Frontend Build (Next.js 14)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080

      - name: Build Frontend Docker Image
        run: docker build -t hookrelay/web:latest .

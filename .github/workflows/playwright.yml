name: Playwright E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  playwright-e2e:
    name: Playwright E2E (Dashboard & DLQ)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Start Docker Compose Stack
        run: |
          docker compose up -d --build postgres redis api worker web
        env:
          HOOKRELAY_WORKER_ENABLED: "true"
          HOOKRELAY_SEED_ENABLED: "true"

      - name: Wait for API and Web App to be Ready
        run: |
          echo "Waiting for HookRelay API (http://localhost:8080/health)..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8080/health; then
              echo "API is healthy!"
              break
            fi
            sleep 3
          done

          echo "Waiting for HookRelay Dashboard (http://localhost:3000)..."
          for i in {1..30}; do
            if curl -s -f http://localhost:3000; then
              echo "Frontend is healthy!"
              break
            fi
            sleep 3
          done

      - name: Install Dependencies & Playwright Browsers
        working-directory: ./web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        working-directory: ./web
        run: |
          npx playwright test
        env:
          BASE_URL: http://localhost:3000
          API_URL: http://localhost:8080

      - name: Upload Playwright Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

      - name: Teardown Docker Compose Stack
        if: always()
        run: |
          docker compose down -v

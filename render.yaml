services:
  # 1. API Web Service
  - type: web
    name: hookrelay-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: hookrelay-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hookrelay-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://hookrelay.vercel.app,https://*.vercel.app
      - key: HOOKRELAY_ENFORCE_HTTPS
        value: "true"
      - key: HOOKRELAY_BLOCK_PRIVATE_IPS
        value: "true"
      - key: HOOKRELAY_WORKER_ENABLED
        value: "true" # Run embedded on free tier, or disable if running dedicated worker

  # 2. Render Dedicated Background Worker (for paid / separated tier)
  - type: worker
    name: hookrelay-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: --spring.profiles.active=worker
    plan: starter
    region: oregon
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: hookrelay-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hookrelay-redis
          property: connectionString
      - key: HOOKRELAY_WORKER_ENABLED
        value: "true"
      - key: HOOKRELAY_WORKER_POLL_DELAY_MS
        value: "1000"
      - key: HOOKRELAY_WORKER_THREADS
        value: "20"
      - key: HOOKRELAY_ENFORCE_HTTPS
        value: "true"
      - key: HOOKRELAY_BLOCK_PRIVATE_IPS
        value: "true"

  # 3. Render Cron Job to Keep Free Instances Warm
  - type: cron
    name: hookrelay-keepwarm
    schedule: "*/10 * * * *"
    command: curl -s -f https://hookrelay-api.onrender.com/actuator/health || true
    plan: free
    region: oregon

databases:
  - name: hookrelay-postgres
    databaseName: hookrelay
    user: hookrelay_user
    plan: free
    region: oregon
    postgresMajorVersion: 16

# Redis Key-Value Store on Render
redis:
  - name: hookrelay-redis
    plan: free
    region: oregon
    ipAllowList: [] # internal access only

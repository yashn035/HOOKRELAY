services:
  # 1. API Web Service
  - type: web
    name: hookrelay-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: api
      - key: DATABASE_URL
        fromDatabase:
          name: hookrelay-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: hookrelay-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: HOOKRELAY_ENFORCE_HTTPS
        value: "true"
      - key: HOOKRELAY_BLOCK_PRIVATE_IPS
        value: "true"
      - key: HOOKRELAY_WORKER_ENABLED
        value: "true"
      - key: HOOKRELAY_WORKER_POLL_DELAY_MS
        value: "1000"
      - key: HOOKRELAY_WORKER_THREADS
        value: "10"

databases:
  - name: hookrelay-postgres
    databaseName: hookrelay
    user: hookrelay_user
    plan: free
    region: oregon
    postgresMajorVersion: 16

# Key-Value Store on Render
keyValue:
  - name: hookrelay-redis
    plan: free
    region: oregon

server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:hookrelay;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

logging:
  level:
    root: INFO
    com.hookrelay: INFO

hookrelay:
  worker:
    enabled: true
    poll-delay-ms: 1000
    threads: 5
  seed:
    enabled: true
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
  security:
    enforce-https: false
    block-private-ips: false

